name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package binary
        run: |
          mkdir -p dist
          cp .build/apple/Products/Release/Swim dist/swim
          chmod +x dist/swim
          tar -czf dist/swim-${{ github.ref_name }}-macos-universal.tar.gz -C dist swim
          shasum -a 256 dist/swim-${{ github.ref_name }}-macos-universal.tar.gz > dist/swim-${{ github.ref_name }}-macos-universal.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swim-macos
          path: |
            dist/swim-${{ github.ref_name }}-macos-universal.tar.gz
            dist/swim-${{ github.ref_name }}-macos-universal.tar.gz.sha256

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        run: |
          wget -q https://download.swift.org/swift-6.1-release/ubuntu2404/swift-6.1-RELEASE/swift-6.1-RELEASE-ubuntu24.04.tar.gz
          tar xf swift-6.1-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.1-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH

      - name: Build
        run: swift build -c release

      - name: Package binary
        run: |
          mkdir -p dist
          cp .build/release/Swim dist/swim
          chmod +x dist/swim
          tar -czf dist/swim-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist swim
          sha256sum dist/swim-${{ github.ref_name }}-linux-x86_64.tar.gz > dist/swim-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swim-linux-x86_64
          path: |
            dist/swim-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/swim-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
